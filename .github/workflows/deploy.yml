name: Build, push to ACR and deploy to ACK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}   # repo variable, e.g. dongzh-demo

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-app
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/url-shortener-app:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/url-shortener-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-nginx
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/url-shortener-nginx:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/url-shortener-nginx:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: aliyun-ack
    steps:
      - uses: actions/checkout@v4
      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy with kustomize
        working-directory: k8s
        run: |
          # pull over the VPC endpoint from inside the cluster
          REG=registry-vpc.cn-hangzhou.aliyuncs.com/${ACR_NAMESPACE}
          kubectl kustomize . >/dev/null
          kustomize edit set image \
            registry.cn-hangzhou.aliyuncs.com/CHANGE_ME/url-shortener-app=${REG}/url-shortener-app:${{ needs.build-push.outputs.tag }} \
            registry.cn-hangzhou.aliyuncs.com/CHANGE_ME/url-shortener-nginx=${REG}/url-shortener-nginx:${{ needs.build-push.outputs.tag }}
          kubectl apply -k .
          kubectl -n url-shortener rollout status deploy/url-shortener-app --timeout=180s
          kubectl -n url-shortener rollout status deploy/url-shortener-nginx --timeout=180s
      - name: Show CLB address
        run: kubectl -n url-shortener get svc url-shortener-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}{"\n"}'
