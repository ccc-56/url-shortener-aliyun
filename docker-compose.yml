services:
  app:
    build:
      context: .
      dockerfile: Dockerfile-app
    environment:
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:8080
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  nginx:
    build:
      context: .
      dockerfile: Dockerfile-nginx
    environment:
      KUBE_DNS: 127.0.0.11          # docker embedded DNS
      BACKEND: app                  # overrides the in-cluster Service FQDN
    ports:
      - "8080:80"
    depends_on:
      - app
