server {
    listen 80;
    server_name _;

    # KUBE_DNS / BACKEND are rendered at container start (nginx/10-kube-dns.envsh).
    # Using a variable in proxy_pass forces nginx to re-resolve the Service name.
    resolver ${KUBE_DNS} valid=5s ipv6=off;
    set $backend ${BACKEND};

    location /api/ {
        proxy_pass http://$backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /r/ {
        proxy_pass http://$backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /healthz {
        access_log off;
        return 200 'ok';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
