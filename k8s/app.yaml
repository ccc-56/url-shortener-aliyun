apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener-app
  namespace: url-shortener
data:
  PORT: "3000"
  # redis-0 via the headless Service; switch to an ApsaraDB Redis endpoint for production
  REDIS_URL: "redis://redis-0.redis.url-shortener.svc.cluster.local:6379"
  # replaced by CI / kustomize once the CLB address or domain is known
  BASE_URL: "http://sh.example.com"
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-app
  namespace: url-shortener
spec:
  type: ClusterIP
  selector:
    app: url-shortener-app
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-app
  namespace: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortener-app
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: url-shortener-app
    spec:
      containers:
        - name: app
          image: registry.cn-hangzhou.aliyuncs.com/CHANGE_ME/url-shortener-app:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: url-shortener-app
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
